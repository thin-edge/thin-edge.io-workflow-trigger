name: Run periodic tasks
permissions:
  contents: read

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  tedge-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger thin-edge.io tests
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          gh workflow run build-workflow.yml \
            --repo reubenmiller/thin-edge.io \
            --raw-field retries=2 \
            --ref ci-configurable-system-test-retries
